<!DOCTYPE html>
<!--
  music core // standalone - one file, no laptop, no server, no install.

  Everything the phone can do by itself: the track list comes from Piped's public API
  (search) or api.listenbrainz.org (recent listens) - both send Access-Control-Allow-Origin: *,
  so no data backend of ours is involved anywhere. Audio plays through
  the official YouTube IFrame player; there is no keyless way to pull the raw stream in a
  browser, which is why the laptop relay (musicplayer_mobile.py) exists for background-heavy
  listening.

  YouTube refuses to feed an embedded player from just any page. Measured on this build:
  opened as file:// every video errors 153, served from a bare IP origin (http://127.0.0.1)
  every video errors 150, served from a named host (http://localhost:8777) they play. So put
  this file on any static host, or on a machine with a hostname - opening it from the phone's
  file manager cannot work, that is Google's check, not this code's.

  iOS Safari suspends the iframe's audio when the tab is hidden or the screen locks; Android
  Chrome keeps playing and gets lock-screen controls via Media Session.

  Sources: "artist song", a YouTube playlist URL or PL/RD id, a single video URL,
           or listenbrainz:<username>
-->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>music core</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #b8a6cc; font: 15px/1.35 ui-monospace, Menlo, Consolas, monospace; }
  body { padding-bottom: 108px; }
  header { padding: 12px 14px 6px; border-bottom: 2px solid #a855f7; }
  h1 { margin: 0 0 8px; font-size: 13px; letter-spacing: 2px; color: #c084fc; }
  .load { display: flex; gap: 8px; }
  .load input { flex: 1; min-width: 0; background: #000; color: #e9d5ff; border: 1px solid #6d28d9;
                border-radius: 6px; padding: 10px; font: inherit; }
  .load button { background: #a855f7; color: #000; border: 0; border-radius: 6px; padding: 10px 14px;
                 font: inherit; font-weight: 700; }
  .status { margin: 8px 2px 0; font-size: 12px; color: #7fd7ea; min-height: 16px; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; padding: 9px 14px;
             border-bottom: 1px solid #17091f; }
  #list li.selected { background: #a855f7; color: #000; }
  .num { width: 30px; flex: none; font-size: 12px; opacity: .55; }
  .name { flex: 1; font-weight: 700; overflow-wrap: anywhere; }
  .dur { width: 46px; flex: none; text-align: right; font-size: 12px; opacity: .9; }
  .meta { flex-basis: 100%; margin-left: 38px; font-size: 12px; opacity: .7; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: #000; border-top: 2px solid #d946ef;
           padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
  .now { font-size: 13px; color: #e9d5ff; font-weight: 700; overflow: hidden; white-space: nowrap;
         text-overflow: ellipsis; }
  .meter { color: #6d28d9; font-size: 12px; letter-spacing: 1px; overflow: hidden; white-space: nowrap; }
  .keys { display: flex; gap: 8px; margin-top: 6px; }
  .keys button { flex: 1; background: #000; color: #c084fc; border: 1px solid #6d28d9; border-radius: 6px;
                 padding: 9px 0; font: inherit; font-weight: 700; }
  .keys button.on { background: #6d28d9; color: #fff; }
  /* iOS refuses to play a hidden player, so keep it 1px and nearly transparent, never display:none. */
  #stage { position: fixed; right: 0; bottom: 0; width: 1px; height: 1px; opacity: .01; pointer-events: none; }
</style>
</head><body>
<header>
  <h1>MUSIC CORE // STANDALONE</h1>
  <div class="load">
    <input id="q" enterkeyhint="search" autocomplete="off"
           placeholder="artist / song, YouTube playlist URL, or listenbrainz:user">
    <button id="go">LOAD</button>
  </div>
  <div class="status" id="status">booting...</div>
</header>
<ul id="list"></ul>
<footer>
  <div class="now" id="now">nothing playing</div>
  <div class="meter" id="meter">tap a track</div>
  <div class="keys">
    <button id="prev">PREV</button>
    <button id="playpause">PLAY</button>
    <button id="next">NEXT</button>
    <button id="auto" class="on">AUTO</button>
  </div>
</footer>
<div id="stage"><div id="video"></div></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const INSTANCES = ["https://pipedapi.ducks.party", "https://api.piped.private.coffee"];
const LB = "https://api.listenbrainz.org/1/user";
const RAMP = [[0x22,0xd3,0xee],[0xf4,0x72,0xb6],[0xa8,0x55,0xf7],[0xf4,0x72,0xb6],[0x22,0xd3,0xee]];

let tracks = [], selected = -1, playing = -1, auto = true;
let mode = "idle", live = INSTANCES[0], player = null, ready = false, label = "";
let pending = -1, blockedStreak = 0;

const el = (id) => document.getElementById(id);
const status = (text) => { el("status").textContent = text; };

// YouTube refuses to feed its embedded player from pages it cannot attribute to a web address.
function originHint() {
  if (location.protocol !== "https:" && location.protocol !== "http:") {
    return "this page is " + location.protocol + " - it needs a http(s) address";
  }
  if (window.top !== window.self) { return "it is inside a preview frame - open the page's own URL"; }
  if (!location.hostname || /^\d{1,3}(\.\d{1,3}){3}$/.test(location.hostname)) {
    return "a bare IP address is refused - use a host name";
  }
  return "an in-app browser or preview wrapper blocks embeds - open this URL in Chrome or Safari";
}

function clock(seconds) {
  const s = Math.max(Math.floor(seconds || 0), 0);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function span(cls, text) {
  const node = document.createElement("span");
  node.className = cls;
  node.textContent = text;
  return node;
}

// Same rule as the TUI: hue and light level follow distance from the selection.
function tint(i) {
  const span_ = Math.max(tracks.length - 1, 12);
  const rel = (i - selected) / span_;
  const t = Math.min(Math.max(0.5 + rel, 0), 1) * (RAMP.length - 1);
  const step = Math.min(Math.floor(t), RAMP.length - 2);
  const f = t - step;
  const rgb = [0, 1, 2].map((c) => Math.round(RAMP[step][c] + (RAMP[step + 1][c] - RAMP[step][c]) * f));
  const light = Math.max(1 - Math.abs(rel) * 0.85, 0.22);
  return "rgb(" + rgb.map((v) => Math.round(v * light)).join(",") + ")";
}

function paint() {
  const list = el("list");
  list.textContent = "";
  tracks.forEach((track, i) => {
    const li = document.createElement("li");
    if (i === selected) {
      li.classList.add("selected");
    } else {
      li.style.color = tint(i);
    }
    li.append(
      span("num", String(i + 1).padStart(2, "0")),
      span("name", track.name),
      span("dur", track.duration),
      span("meta", [track.artist, track.when, track.bad ? "blocks embedding" : ""].filter(Boolean).join("  ·  ")),
    );
    li.addEventListener("click", () => play(i));
    list.appendChild(li);
  });
}

function repaintSelection() {
  const rows = el("list").children;
  for (let i = 0; i < rows.length; i++) {
    rows[i].classList.toggle("selected", i === selected);
    rows[i].style.color = i === selected ? "" : tint(i);
  }
}

function showNow(title, artist) {
  const text = title + (artist ? " - " + artist : "");
  el("now").textContent = text;
  if (!("mediaSession" in navigator) || text === label) { return; }
  label = text;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: title, artist: artist, album: "music core" });
  } catch (err) { /* older browsers have no MediaMetadata */ }
}

async function api(path) {
  const order = [live].concat(INSTANCES.filter((host) => host !== live));
  let last = null;
  for (const host of order) {
    try {
      const res = await fetch(host + path, { headers: { Accept: "application/json" } });
      if (!res.ok) { throw new Error("HTTP " + res.status); }
      live = host;
      return await res.json();
    } catch (err) {
      last = err;  // public instances die or throttle without notice; the next one may answer
    }
  }
  throw new Error("no Piped instance answered (" + (last && last.message) + ")");
}

const videoIdIn = (text) => ((text || "").match(/[?&]v=([A-Za-z0-9_-]{11})/) || [])[1] || "";

function rowFromStream(item) {
  const title = item.title || "?";
  const artist = item.uploaderName || "?";
  return {
    name: title,
    artist: artist,
    seconds: item.duration || 0,
    duration: item.duration ? clock(item.duration) : "—",
    when: item.uploadedDate || "",
    videoId: videoIdIn(item.url),
    probe: title + " " + artist,
  };
}

function humanize(secondsAgo) {
  if (!secondsAgo) { return "?"; }
  if (secondsAgo < 90) { return "just now"; }
  if (secondsAgo < 5400) { return Math.floor(secondsAgo / 60) + "m ago"; }
  if (secondsAgo < 172800) { return Math.floor(secondsAgo / 3600) + "h ago"; }
  return new Date((Date.now() / 1000 - secondsAgo) * 1000).toLocaleDateString();
}

function rowFromListen(listen) {
  const meta = listen.track_metadata || {};
  const info = meta.additional_info || {};
  const ms = Number(info.duration_ms) || 0;
  const service = info.music_service || "";
  const age = Math.max(Math.floor(Date.now() / 1000 - (listen.listened_at || 0)), 0);
  return {
    name: meta.track_name || "?",
    artist: info.artist_names ? info.artist_names.join(", ") : (meta.artist_name || "?"),
    seconds: Math.round(ms / 1000),
    duration: ms ? clock(ms / 1000) : "—",
    when: humanize(age) + (service ? " · " + service : ""),
    videoId: "",
    probe: (meta.track_name || "") + " " + (info.artist_names || [meta.artist_name || ""]).join(" "),
  };
}

function start(videoId) {
  if (!videoId) { status("that track has no YouTube id"); return false; }
  if (!ready || !player) { status("player is still starting"); return false; }
  player.loadVideoById({ videoId: videoId });
  el("playpause").textContent = "PAUSE";
  status("buffering...");
  return true;
}

async function play(i) {
  if (i < 0 || i >= tracks.length) { return; }
  const row = tracks[i];
  selected = i;
  playing = i;
  repaintSelection();
  showNow(row.name, row.artist);
  if (!ready || !player) {
    pending = i;
    status(row.name + " is queued - the player is still starting");
    return;
  }
  if (row.videoId) { start(row.videoId); return; }
  status("finding " + row.name + " on YouTube...");
  try {
    const dead = row.dead || [];
    const data = await api("/search?q=" + encodeURIComponent(row.probe) + "&filter=music_songs");
    const hit = (data.items || []).map(rowFromStream).find((item) => item.videoId && !dead.includes(item.videoId));
    if (!hit) { status("no embeddable upload for " + row.name); return; }
    row.videoId = hit.videoId;
    row.bad = false;
    start(hit.videoId);
  } catch (err) {
    status("lookup failed: " + err.message);
  }
}

function skip(delta) {
  if (mode === "queue") {
    play(Math.min(Math.max(playing + delta, 0), tracks.length - 1));
  } else if (ready && player) {
    if (delta > 0) { player.nextVideo(); } else { player.previousVideo(); }
  }
}

async function load(query) {
  const value = (query || "").trim();
  if (!value) { return; }
  localStorage.setItem("musiccore.source", value);
  status("loading " + value + "...");
  const list = (value.match(/[?&]list=([A-Za-z0-9_-]+)/) || [])[1]
    || (/^(PL|UU|RD|OL|LP)[A-Za-z0-9_-]{8,}$/.test(value) ? value : "");
  const single = videoIdIn(value) || (/^[A-Za-z0-9_-]{11}$/.test(value) ? value : "");
  try {
    if (/^listenbrainz:/i.test(value)) {
      const user = value.slice(13).trim();
      const res = await fetch(LB + "/" + encodeURIComponent(user) + "/listens?count=40",
                              { headers: { Accept: "application/json" } });
      if (!res.ok) { throw new Error("listenbrainz HTTP " + res.status); }
      const payload = (await res.json()).payload || {};
      tracks = (payload.listens || []).map(rowFromListen);
      mode = "queue";
      selected = -1;
      paint();
      status(tracks.length ? user + " // " + tracks.length + " listens (tapped ones get matched on YouTube)"
                           : user + " has no listens yet");
    } else if (list) {
      tracks = [];
      mode = "playlist";
      paint();
      let heading = "playlist " + list;
      try {
        const meta = await api("/playlists/" + list);
        heading = (meta.name || heading) + " · " + (meta.videos || "?") + " videos";
      } catch (err) { /* the id still plays even when no instance can name it */ }
      showNow(heading, "");
      status("playlist auto-advances · NEXT/PREV skip · tap PLAY to start");
      if (ready) { player.loadPlaylist({ listType: "playlist", list: list }); }
    } else if (single) {
      tracks = [];
      mode = "video";
      paint();
      status("playing that video");
      start(single);
    } else {
      const data = await api("/search?q=" + encodeURIComponent(value) + "&filter=music_songs");
      tracks = (data.items || []).filter((item) => videoIdIn(item.url)).map(rowFromStream);
      mode = "queue";
      selected = -1;
      paint();
      status(tracks.length ? value + " // " + tracks.length + " tracks via " + live
                           : "nothing found for " + value);
    }
  } catch (err) {
    status("load failed: " + err.message);
  }
}

function tick() {
  if (!ready || !player) { return; }
  let at = 0, total = 0;
  try {
    at = Math.floor(player.getCurrentTime() || 0);
    total = Math.floor(player.getDuration() || 0);
  } catch (err) { return; }
  if (!total) { return; }
  if (mode !== "queue") {
    const data = player.getVideoData ? player.getVideoData() : {};
    if (data && data.title) { showNow(data.title, data.author || ""); }
  } else if (playing >= 0) {
    total = tracks[playing].seconds || total;
  }
  const cells = 22;
  const filled = Math.round(Math.min(at / total, 1) * cells);
  el("meter").textContent = clock(at) + "/" + clock(total);
  const bar = document.createElement("span");
  bar.textContent = "█".repeat(filled) + "░".repeat(cells - filled);
  el("meter").append(bar);
  if ("mediaSession" in navigator) {
    try { navigator.mediaSession.positionState = { position: at, duration: total }; } catch (err) { /* optional */ }
  }
}
setInterval(tick, 1000);

el("meter").addEventListener("click", (event) => {
  if (!ready || !player) { return; }
  const total = Math.floor(player.getDuration() || 0);
  if (!total) { return; }
  const box = event.currentTarget.getBoundingClientRect();
  player.seekTo(((event.clientX - box.left) / box.width) * total, true);
});

el("go").addEventListener("click", () => load(el("q").value));
el("q").addEventListener("keydown", (event) => { if (event.key === "Enter") { load(event.target.value); } });
el("prev").addEventListener("click", () => skip(-1));
el("next").addEventListener("click", () => skip(1));
el("playpause").addEventListener("click", () => {
  if (!ready || !player) { return; }
  if (playing < 0 && mode === "queue") { play(0); return; }
  if (player.getPlayerState() === YT.PlayerState.PLAYING) {
    player.pauseVideo();
    el("playpause").textContent = "PLAY";
  } else {
    player.playVideo();
    el("playpause").textContent = "PAUSE";
  }
});
el("auto").addEventListener("click", () => {
  auto = !auto;
  el("auto").classList.toggle("on", auto);
  localStorage.setItem("musiccore.auto", auto ? "1" : "0");
});

function buildPlayer() {
  player = new YT.Player("video", {
    playerVars: Object.assign(
      { autoplay: 0, controls: 0, rel: 0, playsinline: 1, iv_load_policy: 3, disablekb: 1 },
      // file:// reports origin "null", and the widget rejects anything it cannot echo back.
      location.protocol.indexOf("http") === 0 ? { origin: location.origin } : {},
    ),
    events: {
      onReady: () => {
        ready = true;
        auto = localStorage.getItem("musiccore.auto") !== "0";
        el("auto").classList.toggle("on", auto);
        if ("mediaSession" in navigator) {
          const nudge = (delta) => player.seekTo(Math.max(player.getCurrentTime() + delta, 0), true);
          const act = { play: () => player.playVideo(), pause: () => player.pauseVideo(),
                        previoustrack: () => skip(-1), nexttrack: () => skip(1),
                        seekbackward: () => nudge(-15), seekforward: () => nudge(15) };
          Object.keys(act).forEach((name) => { try { navigator.mediaSession.setActionHandler(name, act[name]); } catch (err) { /* unsupported */ } });
        }
        const saved = localStorage.getItem("musiccore.source") || "";
        el("q").value = saved;
        if (location.protocol !== "https:" && location.protocol !== "http:") {
          status("no audio from here: " + originHint());
          return;
        }
        if (pending >= 0) {
          const queued = pending;
          pending = -1;
          play(queued);
          return;
        }
        status((saved ? "ready - reloading " + saved : "ready") + " · " + location.host);
        if (saved) { load(saved); }
      },
      onStateChange: (event) => {
        if (event.data === YT.PlayerState.PLAYING) {
          blockedStreak = 0;
          el("playpause").textContent = "PAUSE";
          status("playing");
        }
        else if (event.data === YT.PlayerState.PAUSED) { el("playpause").textContent = "PLAY"; status("paused"); }
        else if (event.data === YT.PlayerState.ENDED) {
          if (mode === "queue") {
            if (auto && playing + 1 < tracks.length) { play(playing + 1); } else { status("end of list"); }
          } else { status("end of playlist"); }
        }
      },
      onError: (event) => {
        // The widget's empty boot iframe reports 153 before we have asked for any video.
        if (mode === "idle") { return; }
        const code = event.data;
        if (code !== 101 && code !== 150 && code !== 153) {
          status("player error " + code + " - tap PLAY to retry");
          return;
        }
        blockedStreak++;
        const row = mode === "queue" && playing >= 0 ? tracks[playing] : null;
        if (row) {
          row.dead = (row.dead || []).concat(row.videoId);
          row.videoId = "";
          row.bad = true;
          paint();
        }
        // One refusal is the uploader's choice; a streak of them is Google refusing this
        // address, and skipping on would silently churn through the entire list.
        if (blockedStreak >= 3) {
          auto = false;
          el("auto").classList.remove("on");
          status(blockedStreak + " uploads refused on " + (location.host || location.protocol)
                 + " (" + code + ") - " + originHint());
          return;
        }
        if (!auto || !row) {
          status((row ? row.name : "that video") + ": this upload blocks embedding (" + code
                 + ") - " + originHint());
          return;
        }
        const next = tracks.findIndex((track, i) => i > playing && !track.bad);
        if (next < 0) { status("no embeddable upload left in this list"); return; }
        status(row.name + ": that upload blocks embedding (" + code + "), skipping ahead");
        play(next);
      },
    },
  });
}

// A cached iframe_api fires its hook before this file can assign it, so build now when it is up.
if (window.YT && window.YT.Player) {
  buildPlayer();
} else {
  window.onYouTubeIframeAPIReady = buildPlayer;
}
setTimeout(() => {
  if (!ready) { status("the YouTube player never loaded - this network cannot reach youtube.com"); }
}, 12000);
</script>
</body></html>
